name: QQ Mail Bot

on:
  workflow_dispatch:
    inputs:
      message_type:
        description: 邮件类型
        type: choice
        options:
          - test
          - random
          - custom
        default: test
      custom_subject:
        description: 自定义邮件主题（仅 custom 使用，可留空）
        type: string
        required: false
        default: ''
      custom_body:
        description: 自定义正文（custom 必填，普通触发参数，请勿填写隐私或凭据）
        type: string
        required: false
        default: ''
      send_delay:
        description: 发送时机
        type: choice
        options:
          - 立即发送
          - 3 分钟内随机发送
        default: 立即发送
      image_path:
        description: 图片路径（可选，例如 images/photo.jpg）
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: mail-bot-manual-mail
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Test
        run: |
          echo "GitHub Actions OK"
          date '+北京时间 %Y-%m-%d %H:%M:%S %z'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Wait before sending
        env:
          SEND_DELAY: ${{ inputs.send_delay || '立即发送' }}
        run: python scripts/wait_before_send.py
      - name: Reserve never-reused random letter
        if: ${{ (inputs.message_type || 'random') == 'random' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.reserve_letter
      - name: Send mail through QQ SMTP
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MESSAGE_TYPE: ${{ inputs.message_type || 'random' }}
          IMAGE_PATH: ${{ inputs.image_path }}
        run: python scripts/send_mail.py
