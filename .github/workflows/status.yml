name: 邮件状态与历史

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - .github/workflows/random.yml
      - .github/workflows/dragon-letter.yml
      - .github/workflows/status.yml
      - scripts/status_history.py
      - scripts/control_bot.py
      - scripts/send_letter.py
      - scripts/reserve_letter.py
  workflow_run:
    workflows: [QQ Mail Bot, Random Mail Scheduler, 小龙娘来信]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: mail-bot-status
  cancel-in-progress: true

jobs:
  status:
    # Ordinary schedule checks do not need another runner just to refresh a page.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name != 'Random Mail Scheduler' ||
      github.event.workflow_run.event != 'schedule' ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build status and history page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_INTERVAL: ${{ vars.MAIL_BOT_POLL_MINUTES || '60' }}
        run: python -m scripts.status_history
