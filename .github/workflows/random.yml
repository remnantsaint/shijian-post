name: 邮件机器人（统一入口）
run-name: ${{ github.event_name == 'schedule' && '定时检查' || github.event_name == 'push' && '代码检查' || github.event_name == 'pull_request' && '代码检查' || inputs.action
  || '查看状态' }}
'on':
  workflow_dispatch:
    inputs:
      action:
        description: 选择功能（默认仅查看状态，不发送）
        type: choice
        options:
        - 查看状态
        - 发送测试邮件
        - 发送随机来信
        - 发送小龙娘来信
        - 发送自定义邮件
        - 发送漫画邮件
        - 安排一次
        - 循环随机发送
        - 关闭计划
        - 运行代码检查
        - 指定时间发送
        - 周期发送
        - 取消任务
        default: 查看状态
      timing:
        description: 目标时间：now、after:10m、带时区时间，或 random:5m:2d
        type: string
        default: ''
        required: false
      repeat_rule:
        description: 重复规则：留空不重复；every:2h 或 random:5m:2d
        type: string
        default: ''
        required: false
      expires_at:
        description: 最晚发送截止时间（可选，必须带时区；留空允许延迟补发一次）
        type: string
        default: ''
        required: false
      custom_subject:
        description: 自定义主题（仅发送自定义邮件使用）
        type: string
        required: false
        default: ''
      custom_body:
        description: 自定义正文（普通触发参数，请勿填写隐私或凭据）
        type: string
        required: false
        default: ''
      image_path:
        description: 图片来源：images/photo.png；漫画可填 draft:图片文件名 或 asset:附件编号
        type: string
        required: false
        default: ''
      request_id:
        description: 自动上传的请求编号；手机草稿图片发送时留空（自动去重）
        type: string
        required: false
        default: ''
      task_id:
        description: 取消单个任务时填写任务编号；关闭计划只关闭重复任务
        type: string
        default: ''
        required: false
  schedule:
  - cron: '*/5 * * * *'
  - cron: 17 * * * *
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Run offline tests without sending mail
      run: python -m unittest discover -s tests -v
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == '运行代码检查')
    permissions:
      contents: read
  tasks:
    name: 统一邮件任务
    needs: checks
    if: always() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (github.event.repository.private == true || (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner)) &&
      (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action != '运行代码检查')) && (github.event_name != 'schedule' ||
      (github.event.schedule == '*/5 * * * *' && vars.MAIL_BOT_POLL_MINUTES == '5') || (github.event.schedule == '17 * * * *' && vars.MAIL_BOT_POLL_MINUTES
      != '5'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: read
    concurrency:
      group: mail-bot-tasks-${{ github.event_name == 'schedule' && 'poll' || inputs.action == '查看状态' && 'status' || 'control' }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: 保存或管理统一任务
      id: prepare
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python -m scripts.task_runner prepare
    - name: Execute unified mail tasks via QQ SMTP
      if: steps.prepare.outputs.execute == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TASK_ID: ${{ steps.prepare.outputs.task_id }}
        QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
        QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
      run: python -m scripts.task_runner run
    - name: 清理已结束任务附件（不改写发送结果）
      if: ${{ always() && inputs.action != '查看状态' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python -m scripts.task_runner cleanup
    - name: 生成统一任务状态与历史
      if: ${{ always() && github.event_name == 'workflow_dispatch' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHECK_INTERVAL: ${{ vars.MAIL_BOT_POLL_MINUTES || '60' }}
      run: python -m scripts.status_history
