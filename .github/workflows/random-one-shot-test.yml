name: Random Mail One Shot Test

on:
  push:
    paths:
      - '.github/workflows/random-one-shot-test.yml'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  random-mail-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Random wait
        run: |
          python - <<'PY'
          import secrets, time
          delay = 20 + secrets.randbelow(71)
          print(f'随机等待 {delay} 秒后发送。', flush=True)
          time.sleep(delay)
          PY
      - name: Send random mail through QQ SMTP
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MESSAGE_TYPE: random
        run: python scripts/send_mail.py
