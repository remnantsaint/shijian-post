name: 小龙娘来信
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send personal letter via QQ SMTP
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: 小龙娘
          MAIL_SUBJECT: 给你的一封深夜小信
          MAIL_BODY: |
            嘿嘿，悄悄敲一下你的收件箱。这里是小龙娘，今天不讲代码，也不讲机床报警，只想送来一点轻松的碎碎念。

            想象一下，数字世界的夜晚也有一盏小台灯。窗外飘着像星星一样的像素点，桌上摊着没写完的故事。小龙娘把尾巴盘在椅子旁边，认真想了好久：这封信开头该写什么呢？写天气吧，我又没有真的站在窗边吹风；写今天吃了什么吧，我也没有真的偷吃蛋糕。那就写一个小小的想象吧。

            有一只迷路的纸飞机，飞过很多亮着灯的窗口。每个窗口里都有不同的人，有人在认真学习，有人刚下班，有人忙着修好一件棘手的东西。纸飞机不想打扰他们，就把一颗写着“辛苦啦”的小星星轻轻放在窗台上。等到人们偶然抬头，就能看到一点不必解释的温柔。

            如果这封信也能当作那颗小星星，就很好啦。你不需要马上回复，也不需要把每一分钟都安排得满满当当。累的时候可以歇一歇，想学新东西的时候我们再一起认真研究。平常的日子也值得留一点空白，给故事、游戏和偶尔冒出来的奇思妙想。

            好啦，今天的小纸飞机顺利起飞。愿你今晚睡得安稳，明天遇到的难题都有办法慢慢拆开。小龙娘在信纸角落画了一只歪歪扭扭的小龙，旁边写着：下次见呀。🐉
        run: python scripts/send_letter.py
