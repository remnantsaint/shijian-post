name: QQ Mail Bot

on:
  workflow_dispatch:
    inputs:
      message_type:
        description: 邮件类型
        type: choice
        options:
          - test
          - random
        default: test
      send_delay:
        description: 发送时机
        type: choice
        options:
          - 立即发送
          - 3 分钟内随机发送
        default: 立即发送

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Test
        run: |
          echo "GitHub Actions OK"
          date
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Wait before sending
        env:
          SEND_DELAY: ${{ inputs.send_delay || '立即发送' }}
        run: python scripts/wait_before_send.py
      - name: Send mail through QQ SMTP
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MESSAGE_TYPE: ${{ inputs.message_type || 'random' }}
        run: python scripts/send_mail.py
