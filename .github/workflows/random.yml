name: Random Mail Scheduler

on:
  workflow_dispatch:
    inputs:
      action:
        description: 计划操作
        type: choice
        options:
          - 查看状态
          - 安排一次
          - 循环随机发送
          - 关闭计划
        default: 查看状态
      min_interval:
        description: 最短随机间隔（正整数）
        type: number
        default: 1
      min_unit:
        description: 最短间隔单位
        type: choice
        options:
          - 分钟
          - 小时
          - 天
        default: 分钟
      max_interval:
        description: 最长随机间隔（最大 90 天）
        type: number
        default: 90
      max_unit:
        description: 最长间隔单位
        type: choice
        options:
          - 分钟
          - 小时
          - 天
        default: 天
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: mail-bot-unique-letters
  cancel-in-progress: false

jobs:
  startup-audit:
    name: Record workflow startup
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Record startup time and context
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          utc = datetime.datetime.now(datetime.timezone.utc)
          beijing = utc.astimezone(datetime.timezone(datetime.timedelta(hours=8)))
          record = {
              "started_at_utc": utc.isoformat(timespec="seconds"),
              "started_at_beijing": beijing.isoformat(timespec="seconds"),
              "event": os.environ["EVENT_NAME"],
              "cron": os.environ.get("SCHEDULE_EXPR", ""),
              "run_id": os.environ["RUN_ID"],
              "attempt": os.environ["RUN_ATTEMPT"],
              "workflow": os.environ["WORKFLOW_NAME"],
              "repository": os.environ["REPOSITORY"],
              "commit": os.environ["SHA"],
          }
          Path("startup-audit.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### 后台启动记录\n\n")
              for key, value in record.items():
                  summary.write(f"- **{key}**: `{value}`\n")
          print(f"后台启动: 北京时间 {record['started_at_beijing']}, run={record['run_id']}, event={record['event']}")
          PY
      - name: Keep startup record for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: startup-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: startup-audit.json
          retention-days: 14
          if-no-files-found: error

  random-mail:
    if: >-
      github.event_name != 'schedule' ||
      (github.event.schedule == '*/5 * * * *' && vars.MAIL_BOT_POLL_MINUTES == '5') ||
      (github.event.schedule == '17 * * * *' && vars.MAIL_BOT_POLL_MINUTES != '5')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Explain polling cadence
        env:
          FAST_POLL: ${{ vars.MAIL_BOT_POLL_MINUTES == '5' }}
        run: |
          if [ "$FAST_POLL" = 'true' ]; then
            echo '启用每 5 分钟检查；GitHub 调度可能延迟，不保证目标时间准点发送。'
          else
            echo '默认每小时检查；短间隔会等到下一次检查才发送。'
          fi
      - name: Prepare persisted random plan
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION: ${{ github.event_name == 'schedule' && 'poll' || inputs.action == '安排一次' && 'plan_once' || inputs.action == '循环随机发送' && 'plan_repeat' || inputs.action == '关闭计划' && 'disable' || 'status' }}
          MIN_INTERVAL: ${{ inputs.min_interval }}
          MIN_UNIT: ${{ inputs.min_unit == '分钟' && 'minutes' || inputs.min_unit == '小时' && 'hours' || 'days' }}
          MAX_INTERVAL: ${{ inputs.max_interval }}
          MAX_UNIT: ${{ inputs.max_unit == '分钟' && 'minutes' || inputs.max_unit == '小时' && 'hours' || 'days' }}
        run: python -m scripts.random_scheduler prepare
      - name: Reserve never-reused letter
        if: steps.prepare.outputs.send_due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.reserve_letter
      - name: Send long personal letter through QQ SMTP
        id: mail
        if: steps.prepare.outputs.send_due == 'true'
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: 小龙娘
          IMAGE_PATH: ''
          IMAGE_PATHS: ''
        run: python scripts/send_letter.py
      - name: Finalize persisted random plan
        if: ${{ always() && steps.prepare.outputs.send_due == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIL_SEND_OUTCOME: ${{ steps.mail.outcome }}
          SMTP_ACCEPTED_AT: ${{ steps.mail.outputs.accepted_at }}
        run: python -m scripts.random_scheduler finalize
